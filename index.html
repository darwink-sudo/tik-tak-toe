<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freaky Tic-Tac-Toe</title>
  <style>
    :root {
      --bg1: #1a0033;
      --bg2: #2b0f5a;
      --panel: rgba(255, 255, 255, 0.07);
      --cell: linear-gradient(135deg, #ff4fd8, #7a5cff, #1ad7ff);
      --x: #ffe66d;
      --o: #7cf7ff;
      --text: #fff4ff;
      --win: #fffb92;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg,
        #ff4fd8 0%,
        #ff7b54 16%,
        #ffe66d 32%,
        #4de2a8 50%,
        #4db6ff 68%,
        #7a5cff 84%,
        #ff4fd8 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body::before,
    body::after {
      content: "FAHH";
      position: absolute;
      font-size: clamp(4rem, 12vw, 18rem);
      font-weight: 900;
      color: rgba(255,255,255,0.12);
      text-shadow: 0 0 18px rgba(255,255,255,0.3);
      pointer-events: none;
      z-index: 0;
      animation: drift 10s ease-in-out infinite alternate;
    }

    body::before {
      top: 8%;
      left: 5%;
      transform: rotate(-14deg);
    }

    body::after {
      right: 4%;
      bottom: 10%;
      content: "NO WAY";
      transform: rotate(12deg);
      animation-delay: 1.5s;
    }

    @keyframes drift {
      0% { transform: translateY(0) rotate(-14deg); }
      100% { transform: translateY(20px) rotate(10deg); }
    }

    .game {
      position: relative;
      z-index: 1;
      width: min(92vw, 420px);
      background: var(--panel);
      border: 2px solid rgba(255,255,255,0.22);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 28px rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 3vw, 2rem);
    }

    button.reset {
      background: #ff7dcf;
      color: #1b102d;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .cell {
      aspect-ratio: 1;
      border: none;
      border-radius: 18px;
      background: var(--cell);
      color: var(--text);
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.12), 0 0 16px rgba(255,255,255,0.18);
      filter: saturate(1.3) contrast(1.1);
    }

    .cell:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 28px rgba(0,0,0,0.25), 0 0 22px rgba(255,255,255,0.35);
      filter: saturate(1.5) brightness(1.08);
    }

    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.meme-x { color: var(--x); }
    .cell.meme-o { color: var(--o); }
    .cell.win {
      background: rgba(255, 230, 109, 0.25);
      color: var(--win);
      box-shadow: 0 0 18px rgba(255, 230, 109, 0.4);
    }

    .status {
      margin-top: 18px;
      text-align: center;
      min-height: 24px;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .meme {
      margin-top: 10px;
      min-height: 22px;
      text-align: center;
      font-size: 0.9rem;
      color: #ffd7f2;
      opacity: 0.9;
      letter-spacing: 0.04em;
    }

  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <h1>Freaky Tic-Tac-Toe</h1>
      <button class="reset" onclick="resetBoard()">Reset</button>
    </div>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <div class="status" id="status">Player X's turn</div>
    <div class="meme" id="meme">Bro, this is wild 😵‍💫</div>
  </div>

  <script>
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const memeEl = document.getElementById("meme");
    const cells = Array.from(document.querySelectorAll(".cell"));

    const xMeme = "😮‍💨";
    const oMeme = "💥";
    const memes = ["😮‍💨", "💥"];

    const memeSoundPatterns = [
      [220, 330, 440],
      [180, 260, 390],
      [330, 220, 660],
      [300, 150, 500],
      [440, 280, 160],
      [200, 420, 310]
    ];

    let audioCtx = null;
    let board = Array(9).fill("");
    let currentPlayer = "X";
    let gameOver = false;

    const winPatterns = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function ensureAudio() {
      if (!audioCtx) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        audioCtx = new AudioCtor();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = "sine", volume = 0.05) {
      const ctx = ensureAudio();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    }

    function playFahhBurst(freqStart, freqEnd, duration, volume) {
      const ctx = ensureAudio();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function playMoveSound() {
      playFahhBurst(240, 120, 0.18, 0.24);
      setTimeout(() => playFahhBurst(180, 80, 0.16, 0.18), 60);
    }

    function playWinSound() {
      playFahhBurst(260, 70, 0.5, 0.38);
      setTimeout(() => playFahhBurst(200, 60, 0.42, 0.36), 90);
      setTimeout(() => playFahhBurst(140, 40, 0.5, 0.3), 180);
    }

    function playDrawSound() {
      playFahhBurst(200, 90, 0.28, 0.2);
      setTimeout(() => playFahhBurst(160, 70, 0.24, 0.18), 100);
      setTimeout(() => playFahhBurst(120, 60, 0.22, 0.16), 190);
    }

    function updateStatus(text) {
      statusEl.textContent = text;
    }

    function showRandomMeme() {
      const meme = memes[Math.floor(Math.random() * memes.length)];
      memeEl.textContent = meme;

      const pattern = memeSoundPatterns[Math.floor(Math.random() * memeSoundPatterns.length)];
      pattern.forEach((freq, i) => {
        setTimeout(() => {
          playTone(freq, 0.11, i % 2 === 0 ? "square" : "triangle", 0.09);
        }, i * 70);
      });
    }

    function checkWinner() {
      for (const combo of winPatterns) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return combo;
        }
      }
      return null;
    }

    function handleCellClick(e) {
      ensureAudio();
      showRandomMeme();

      const index = Number(e.target.dataset.index);
      if (board[index] || gameOver) return;

      board[index] = currentPlayer;
      e.target.textContent = currentPlayer === "X" ? xMeme : oMeme;
      e.target.classList.add(currentPlayer === "X" ? "meme-x" : "meme-o");

      const winnerCombo = checkWinner();
      if (winnerCombo) {
        gameOver = true;
        winnerCombo.forEach(i => cells[i].classList.add("win"));
        updateStatus(`Player ${currentPlayer} wins!`);
        playWinSound();
        return;
      }

      if (board.every(Boolean)) {
        gameOver = true;
        updateStatus("Draw! The chaos is endless.");
        playDrawSound();
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus(`Player ${currentPlayer}'s turn`);
      playMoveSound();
    }

    function resetBoard() {
      board = Array(9).fill("");
      currentPlayer = "X";
      gameOver = false;

      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("x", "o", "meme-x", "meme-o", "win");
      });

      updateStatus("Player X's turn");
      memeEl.textContent = "Bro, this is wild 😵‍💫";
      playTone(120, 0.08, "triangle", 0.03);
    }

    cells.forEach(cell => {
      cell.addEventListener("click", handleCellClick);
    });

    resetBoard();
  </script>
</body>
</html>
